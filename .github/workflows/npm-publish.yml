name: Sync Version & Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 2.1.0). Do not bump package.json in git; this workflow sets it from the release tag or this input.'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # package.json in git is not the published version. Release tag / dispatch input is.
      - env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${RELEASE_TAG:-$DISPATCH_VERSION}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "No version from release tag or dispatch input" >&2
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm publish --provenance --access public
